name: Verify ijji release
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  source-and-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify current runtime, product continuity and sharing assets
        run: python3 scripts/verify-r11.py
